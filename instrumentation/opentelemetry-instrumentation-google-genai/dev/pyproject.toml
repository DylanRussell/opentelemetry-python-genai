[project]
name = "test-google-genai-instrumentation-changes"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-instrumentation-google-genai",
    "opentelemetry-util-genai[upload]",
    "google-genai>=1.32.0,<3",
    "google-auth>=2.0.0",
    "grpcio>=1.60.0",
    "requests>=2.31.0",
    "websockets>=13.0",
    "cryptography>=42.0",
    "opentelemetry-sdk~=1.43",
    "opentelemetry-exporter-otlp-proto-grpc~=1.43",
    "opentelemetry-semantic-conventions>=0.64b0,<1",
    "opentelemetry-instrumentation>=0.64b0,<1",
]

[tool.uv]
no-sources = false

[tool.uv.workspace]

[tool.uv.sources]
opentelemetry-util-genai = { path = "../../../util/opentelemetry-util-genai", editable = true }
opentelemetry-instrumentation-google-genai = { path = "..", editable = true }
